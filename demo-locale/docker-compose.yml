# Demo locale del server del Laboratorio Sperimentale.
# Avvia: docker compose up -d     Ferma: docker compose down
# Poi apri http://localhost:8080 (vedi README.md in questa cartella).

name: lab-demo

services:

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./indice:/srv/indice:ro
      - ./siti:/srv/siti:ro
      # le due pagine del mockup, servite dalla cartella principale del progetto
      - ../index.html:/srv/mockup/index.html:ro
      - ../interfaccia.html:/srv/mockup/interfaccia.html:ro
      - ../css:/srv/mockup/css:ro
      - ../js:/srv/mockup/js:ro
      - ../img:/srv/mockup/img:ro

  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-11}
    restart: unless-stopped
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: git.localhost
      FORGEJO__server__ROOT_URL: http://git.localhost:8080/
      # salta la pagina di installazione: utenti e repository li crea prepara-esempi.sh
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      FORGEJO__server__OFFLINE_MODE: "true"
    volumes:
      - forgejo_data:/data

  kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data

  # NoSketchEngine è facoltativo: pesa circa 1 GB e serve una cartella di corpora.
  # Avvio:  CORPORA_DIR=/percorso/dei/corpora docker compose --profile noske up -d
  noske:
    profiles: ["noske"]
    image: ${NOSKE_IMAGE:-eltedh/nosketch-engine:latest}
    restart: unless-stopped
    environment:
      SERVER_NAME: http://corpora.localhost:8080/
      SERVER_ALIAS: corpora.localhost
      PRIVATE_KEY: ""
      PUBLIC_KEY: ""
      HTACCESS: ""
      HTPASSWD: ""
    volumes:
      - ${CORPORA_DIR:-./corpora-esempio}:/corpora

volumes:
  forgejo_data:
  kuma_data:
